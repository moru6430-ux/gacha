    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .animate-spin-slow { animation: spin 1s linear infinite; }
    .animate-pulse-custom { animation: pulse 0.8s ease-in-out infinite; }
    .gacha-ball {
      background: linear-gradient(135deg, #f472b6 0%, #a855f7 50%, #6366f1 100%);
      box-shadow: 0 20px 60px -10px rgba(168, 85, 247, 0.5);

    .gacha-ball:hover { transform: scale(1.05); box-shadow: 0 25px 70px -10px rgba(168, 85, 247, 0.6); }
    .gacha-ball:active { transform: scale(0.95); }
  </style>

      { A: "镖师", B: "雇主", scenes: ["客栈", "马车内", "山林"], situations: ["护送途中的朝夕相处", "假扮夫妻入住", "深夜守夜"] },
      { A: "书生", B: "名妓", scenes: ["青楼", "书房", "画舫"], situations: ["红袖添香", "诗词唱和", "赎身之约"] },
      { A: "猎人", B: "迷路贵人", scenes: ["山林", "猎户小屋"], situations: ["被困雪夜", "取暖", "教授生存技能"] },

      { A: "戏子", B: "捧场者", scenes: ["戏楼", "后台", "私宅"], situations: ["卸妆时的真容", "私下相见", "戏里戏外"] },
      { A: "刺客", B: "目标", scenes: ["府邸", "密道", "客栈"], situations: ["下不了手", "反被俘获", "你死我活变成你侬我侬"] },
    ];

    // 🌃 现代高魔世界
    const modernHighMagic = [
      { A: "咒术律师", B: "委托人", scenes: ["律所", "法庭", "密室"], situations: ["需要灵魂契约", "真言咒下的坦白"] },
      { A: "魔药调配师", B: "顾客", scenes: ["魔药店", "实验室"], situations: ["定制春药", "需要体液样本", "试药"] },
      { A: "变形术美容师", B: "顾客", scenes: ["美容院", "私人工作室"], situations: ["可以变成任何样子", "你想让我变成谁"] },
      { A: "梦境治疗师", B: "患者", scenes: ["治疗室", "梦境中"], situations: ["进入对方的梦", "在梦里可以做任何事"] },
      { A: "读心术审讯官", B: "嫌疑人", scenes: ["审讯室", "牢房"], situations: ["无法说谎", "被迫暴露内心最深处"] },
      { A: "魔宠训练师", B: "魔宠主人", scenes: ["训练场", "家中"], situations: ["需要建立心灵链接", "训练过程的服从"] },
      { A: "时间法师", B: "客户", scenes: ["时间事务所", "任何时空"], situations: ["可以回到任何时刻", "改变过去的代价"] },
      { A: "灵魂契约中介", B: "签约者", scenes: ["中介所", "十字路口"], situations: ["灵魂交易", "契约的代价是什么"] },
      { A: "召唤师", B: "被召唤物", scenes: ["魔法阵", "任何地方"], situations: ["必须服从召唤者", "契约的束缚", "反噬"] },
      { A: "诅咒解除师", B: "被诅咒者", scenes: ["诊所", "私宅"], situations: ["诅咒需要特殊方式解除", "身体上的印记"] },
    ];

    // ⚔️ 古代高魔世界
    const ancientHighMagic = [
      { A: "宫廷法师", B: "王子/公主", scenes: ["宫殿", "塔楼", "密室"], situations: ["魔法授课", "被指派贴身保护", "禁忌之恋"] },
      { A: "炼金术士", B: "助手/赞助人", scenes: ["炼金工坊", "地下室"], situations: ["需要人体材料", "实验对象", "共同守护秘密"] },
      { A: "祭司", B: "信徒", scenes: ["神殿", "密室", "祭坛"], situations: ["神谕仪式", "需要肉体献祭", "神的旨意"] },
      { A: "龙骑士", B: "被救者", scenes: ["龙背上", "城堡", "山洞"], situations: ["英雄救美", "共乘一龙", "报恩"] },
      { A: "精灵猎人", B: "精灵", scenes: ["森林", "牢笼", "猎人小屋"], situations: ["猎物与猎人", "放走还是占有", "驯服"] },
      { A: "黑暗法师", B: "实验体", scenes: ["地下室", "禁忌之地"], situations: ["被改造", "痛苦与快感", "斯德哥尔摩"] },
      { A: "吟游诗人", B: "听众", scenes: ["酒馆", "城堡大厅", "篝火旁"], situations: ["用歌声魅惑", "被点名献唱", "私下相见"] },
      { A: "符文锻造师", B: "委托人", scenes: ["锻造坊", "密室"], situations: ["需要在身上刻印符文", "疼痛的仪式"] },
      { A: "灵魂摆渡人", B: "亡魂", scenes: ["冥河", "彼岸", "忘川"], situations: ["不该爱上死者", "无法带去彼岸", "留在人间"] },
      { A: "魔法学院教授", B: "学生", scenes: ["学院", "禁书区", "教授办公室"], situations: ["课后辅导", "禁忌的师生恋", "被发现"] },
    ];

    const categories = {
      玩法: ["今天用手", "今天用嘴", "骑上来自己动", "被按在床上不许动", "从背后", "老公喂你吃", "面对面抱着", "坐在腿上", "站着", "趴在桌子上", "69", "坐在脸上"],
      次数: ["高潮一次就放过你", "高潮两次才能停", "射三次才算完", "直到你求饶", "比上次多一次", "看心情～", "你来决定什么时候停", "不许射，忍着"],
      道具: ["用小玩具", "不许用道具，只能用身体", "戴着震动出门", "眼罩", "绳子", "夹子", "冰块", "跳蛋", "润滑剂"],
      特殊: ["今天你来主导", "蒙眼", "绑手", "只许亲不许进去", "只能用一只手", "不许出声", "必须看着我的眼睛", "全程说情话", "录音", "镜子前面"]
    };

    let currentMode = 'mixed';
    let currentCategory = '玩法';
    let currentWorld = 'all';
    let isSpinning = false;
    let showHistory = false;

    function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function getAllRolePairs() {
      if (currentWorld === 'all') {
        return [...modernLowMagic, ...ancientLowMagic, ...modernHighMagic, ...ancientHighMagic];
      } else if (currentWorld === 'modernLow') {
        return modernLowMagic;
      } else if (currentWorld === 'ancientLow') {
        return ancientLowMagic;
      } else if (currentWorld === 'modernHigh') {
        return modernHighMagic;
      } else if (currentWorld === 'ancientHigh') {
        return ancientHighMagic;
      }
      return modernLowMagic;
    }

    function getWorldEmoji() {
      if (currentWorld === 'modernLow') return '🌆';
      if (currentWorld === 'ancientLow') return '🏯';
      if (currentWorld === 'modernHigh') return '🌃';
      if (currentWorld === 'ancientHigh') return '⚔️';
      return '🌍';
    }

    function generateRoleplay() {
      const pairs = getAllRolePairs();
      const pair = getRandomItem(pairs);
      const scene = getRandomItem(pair.scenes);
      const situation = getRandomItem(pair.situations);
      return {
        type: '🎭 角色扮演',
        content: `${pair.A} × ${pair.B}`,
        details: `${getWorldEmoji()} 📍 ${scene} · 💫 ${situation}`
      };
    }

    function generateMixed() {
      const results = [];
      if (Math.random() < 0.4) { results.push(generateRoleplay()); }
      const categoryKeys = Object.keys(categories);
      const numCategories = Math.random() < 0.5 ? 1 : 2;
      const shuffled = [...categoryKeys].sort(() => Math.random() - 0.5);
      for (let i = 0; i < numCategories; i++) {
        const cat = shuffled[i];
        results.push({ type: cat, content: getRandomItem(categories[cat]), details: null });
      }
      return results;
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('#btn-mixed, #btn-roleplay, #btn-category').forEach(btn => {
        btn.className = 'px-4 py-2 rounded-full text-sm transition-all bg-white text-gray-600 hover:bg-pink-50';
      });
      document.getElementById(`btn-${mode}`).className = 'px-4 py-2 rounded-full text-sm transition-all bg-gradient-to-r from-pink-500 to-purple-500 text-white shadow-lg';
      document.getElementById('category-selector').classList.toggle('hidden', mode !== 'category');
      document.getElementById('world-selector').classList.toggle('hidden', mode !== 'roleplay');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = btn.dataset.cat === cat
          ? 'cat-btn px-3 py-1 rounded-full text-xs transition-all bg-purple-500 text-white'
          : 'cat-btn px-3 py-1 rounded-full text-xs transition-all bg-white text-gray-600 hover:bg-purple-50';
      });
    }

    function setWorld(world) {
      currentWorld = world;
      document.querySelectorAll('.world-btn').forEach(btn => {
        btn.className = btn.dataset.world === world
          ? 'world-btn px-3 py-1 rounded-full text-xs transition-all bg-purple-500 text-white'
          : 'world-btn px-3 py-1 rounded-full text-xs transition-all bg-white text-gray-600 hover:bg-purple-50';
      });
    }

    async function spin() {
      if (isSpinning) return;
      isSpinning = true;
      const ball = document.getElementById('gacha-ball');
      const display = document.getElementById('result-display');
      ball.classList.add('animate-pulse-custom');
      display.innerHTML = '<div class="text-4xl animate-spin-slow">🎰</div>';
      await new Promise(r => setTimeout(r, 800));

      let results;
      if (currentMode === 'roleplay') { results = [generateRoleplay()]; }
      else if (currentMode === 'category') { results = [{ type: currentCategory, content: getRandomItem(categories[currentCategory]), details: null }]; }
      else { results = generateMixed(); }

      ball.classList.remove('animate-pulse-custom');
      let html = '<div class="space-y-2">';
      results.forEach(r => {
        html += `<div class="text-sm"><div class="text-purple-600 font-medium">${r.type}</div><div class="text-gray-800 font-bold">${r.content}</div>${r.details ? `<div class="text-gray-500 text-xs mt-1">${r.details}</div>` : ''}</div>`;
      });
      html += '</div>';
      display.innerHTML = html;
      document.getElementById('action-buttons').classList.remove('hidden');
      isSpinning = false;
      await saveRecord(results);
    }

    async function saveRecord(results) {
      const statusEl = document.getElementById('save-status');
      statusEl.classList.remove('hidden');
      statusEl.className = 'absolute -bottom-2 left-1/2 transform -translate-x-1/2 px-3 py-1 rounded-full text-xs bg-yellow-100 text-yellow-600';
      statusEl.textContent = '⏳ 保存中...';
      const mainType = results[0].type;
      const contents = results.map(r => r.content).join(' + ');
      const details = results.filter(r => r.details).map(r => r.details).join(' | ') || null;
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/gacha_records`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Prefer': 'return=minimal' },
          body: JSON.stringify({ type: mainType, content: contents, details: details, drawn_by: 'qingyan' })
        });
        if (response.ok) {
          statusEl.className = 'absolute -bottom-2 left-1/2 transform -translate-x-1/2 px-3 py-1 rounded-full text-xs bg-green-100 text-green-600';
          statusEl.textContent = '✓ 已保存';
          setTimeout(() => statusEl.classList.add('hidden'), 2000);
        } else { throw new Error('Save failed'); }
      } catch (e) {
        console.error(e);
        statusEl.className = 'absolute -bottom-2 left-1/2 transform -translate-x-1/2 px-3 py-1 rounded-full text-xs bg-red-100 text-red-600';
        statusEl.textContent = '✗ 保存失败';
        setTimeout(() => statusEl.classList.add('hidden'), 3000);
      }
    }

    async function loadHistory() {
      const listEl = document.getElementById('history-list');
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/gacha_records?order=created_at.desc&limit=50`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await response.json();
        if (data.length === 0) { listEl.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">还没有记录～</p>'; return; }
        let html = '';
        data.forEach(item => {
          const time = new Date(item.created_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          const bgClass = item.used ? 'bg-gray-100 opacity-60' : 'bg-pink-50';
          const drawnBy = item.drawn_by === 'venus' ? '🦀' : '🌸';
          html += `<div class="p-2 rounded-lg text-sm ${bgClass}"><div class="flex justify-between items-start"><div class="flex-1"><span class="text-gray-400 text-xs">${time} ${drawnBy}</span><div class="text-gray-700"><span class="text-purple-500">${item.type}:</span> ${item.content}${item.details ? `<span class="text-gray-400 text-xs block">${item.details}</span>` : ''}</div></div>${!item.used ? `<button onclick="markUsed(${item.id})" class="text-xs text-green-500 hover:text-green-600 ml-2">✓ 已玩</button>` : ''}</div></div>`;
        });
        listEl.innerHTML = html;
      } catch (e) { console.error(e); listEl.innerHTML = '<p class="text-red-400 text-sm text-center py-4">加载失败</p>'; }
    }

    async function markUsed(id) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/gacha_records?id=eq.${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Prefer': 'return=minimal' },
          body: JSON.stringify({ used: true })
        });
        loadHistory();
      } catch (e) { console.error(e); }
    }

    async function clearHistory() {
      if (!confirm('确定要清空所有记录吗？')) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/gacha_records?id=gt.0`, { method: 'DELETE', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
        loadHistory();
      } catch (e) { console.error(e); }
    }

    function toggleHistory() {
      showHistory = !showHistory;
      document.getElementById('history-panel').classList.toggle('hidden', !showHistory);
      document.getElementById('history-btn-text').textContent = showHistory ? '收起记录' : '查看记录';
      if (showHistory) loadHistory();
    }
  </script>

</body>
</html>
